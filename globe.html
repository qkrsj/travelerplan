<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 지구본</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #c2dff0;
  --land: #e4efdc;
  --visited: #e11d48;
  --visited-line: #9a1538;
  --ink: #10283a;
  --ink-2: #47617a;
  --panel: rgba(255, 255, 255, .94);
  --panel-solid: #ffffff;
  --line: rgba(16, 40, 58, .18);
  --field: rgba(60, 100, 140, .09);
  --accent: #e11d48;
  --on-accent: #ffffff;
  --focus: #1d5fd1;
  --err: #c0271b;
  --warn: #8a5a00;
  --ok: #17703f;
  --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0a2138; --land: #1b4560; --ink: #e8f3fb; --ink-2: #9db8cb;
    --panel: rgba(8, 28, 48, .92); --panel-solid: #0c2a45; --line: rgba(180, 215, 240, .2);
    --field: rgba(160, 200, 235, .1); --accent: #ffd23f; --on-accent: #10283a;
    --visited: #ffd23f; --visited-line: #caa30f;
    --focus: #7fb2ff; --err: #ff9a8f; --warn: #ffd27a; --ok: #7be0a5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--sea); color: var(--ink); font-family: var(--body);
  font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px;
}
h1 { font-family: var(--display); font-weight: 400; }

/* ---------- 인증 화면 ---------- */
#authScreen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--sea); z-index: 20;
}
#authBox {
  width: min(360px, 92vw); background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
}
#authBox h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
#authBox .sub { margin: 0 0 18px; text-align: center; color: var(--ink-2); font-size: 12.5px; }
.authTabs { display: flex; gap: 6px; margin-bottom: 16px; }
.authTab {
  flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--field);
  font-weight: 600; font-size: 13px;
}
.authTab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.authField { display: block; margin: 10px 0; }
.authField span { display: block; margin-bottom: 4px; font-size: 12.5px; color: var(--ink-2); }
.authField input {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--field);
}
#authSubmit {
  width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 10px;
  background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14px;
}
#authMsg { min-height: 18px; margin-top: 10px; font-size: 12.5px; color: var(--err); text-align: center; }

/* ---------- 앱 화면 ---------- */
#appScreen { position: fixed; inset: 0; display: none; }
#appScreen.on { display: block; }
#globeMap { position: absolute; inset: 0; }
#topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center;
  gap: 10px; padding: 10px 14px; background: var(--panel); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
#topbar h1 { margin: 0; font-size: 18px; flex: 0 0 auto; }
#topbar .who { flex: 1 1 auto; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink); border-radius: 9px;
  padding: 8px 12px; font-size: 13px; font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

#sidePanel {
  position: absolute; top: 58px; right: 0; bottom: 0; width: min(340px, 100vw); z-index: 5;
  background: var(--panel); backdrop-filter: blur(6px); border-left: 1px solid var(--line);
  overflow-y: auto; padding: 14px; transform: translateX(0); transition: transform .2s;
}
#sidePanel.hidden { transform: translateX(100%); }
#sidePanel h2 { margin: 0 0 10px; font-size: 15px; }
#countryList { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
#countryList button {
  border: 1px solid var(--line); background: var(--field); border-radius: 999px; padding: 5px 10px; font-size: 12.5px;
}
#countryList button.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#entryList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.entry {
  border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel-solid);
}
.entry .meta { font-size: 11.5px; color: var(--ink-2); margin-bottom: 4px; }
.entry .text { font-size: 13px; white-space: pre-wrap; margin: 0 0 6px; }
.entry .photos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.entry .photos img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
.entry .del { border: none; background: transparent; color: var(--err); font-size: 11.5px; padding: 2px 0; }
#emptyNote { color: var(--ink-2); font-size: 12.5px; }

#fab {
  position: absolute; left: 16px; bottom: 16px; z-index: 5; border: none; border-radius: 999px;
  background: var(--accent); color: var(--on-accent); padding: 14px 18px; font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.2);
}

#entryModal {
  position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
  background: rgba(10, 20, 30, .45); padding: 16px;
}
#entryModal.on { display: flex; }
#entryForm {
  width: min(420px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel-solid);
  border-radius: 16px; padding: 20px;
}
#entryForm h2 { margin: 0 0 14px; font-size: 17px; }
.field { display: block; margin: 10px 0; }
.field span { display: block; margin-bottom: 4px; font-size: 12.5px; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--field);
}
.field textarea { min-height: 90px; resize: vertical; }
.modalBtns { display: flex; gap: 8px; margin-top: 16px; }
.modalBtns .btn { flex: 1; }
#entryMsg { min-height: 18px; margin-top: 8px; font-size: 12.5px; color: var(--err); }

.photo-view {
  position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.8); padding: 20px;
}
.photo-view.on { display: flex; }
.photo-view img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>

<div id="authScreen">
  <div id="authBox">
    <h1>🌍 여행 지구본</h1>
    <p class="sub">가입한 나만의 지구본에 여행을 기록해요</p>
    <div class="authTabs" role="tablist">
      <button type="button" class="authTab" id="tabLogin" aria-selected="true">로그인</button>
      <button type="button" class="authTab" id="tabSignup" aria-selected="false">회원가입</button>
    </div>
    <form id="authForm">
      <label class="authField"><span>이메일</span><input id="authEmail" type="email" autocomplete="username" required></label>
      <label class="authField"><span>비밀번호 (6자 이상)</span><input id="authPw" type="password" autocomplete="current-password" minlength="6" required></label>
      <button id="authSubmit" type="submit">로그인</button>
    </form>
    <p id="authMsg"></p>
  </div>
</div>

<div id="appScreen">
  <div id="globeMap"></div>
  <div id="topbar">
    <h1>🌍 여행 지구본</h1>
    <span class="who" id="whoEmail"></span>
    <button class="btn" id="logoutBtn">로그아웃</button>
  </div>
  <button id="fab" type="button">＋ 일기 추가</button>
  <aside id="sidePanel">
    <h2>내가 방문한 나라</h2>
    <ul id="countryList"></ul>
    <h2 id="entryListTitle">나라를 골라보세요</h2>
    <ul id="entryList"></ul>
    <p id="emptyNote" hidden>아직 기록이 없어요. 오른쪽 아래 "＋ 일기 추가"로 시작해 보세요.</p>
  </aside>
</div>

<div id="entryModal">
  <form id="entryForm">
    <h2>✏️ 여행 일기 추가</h2>
    <label class="field"><span>나라</span>
      <select id="fCountry" required></select>
    </label>
    <label class="field"><span>도시 (선택)</span><input id="fCity" type="text" placeholder="예: 도쿄"></label>
    <label class="field"><span>날짜</span><input id="fDate" type="date" required></label>
    <label class="field"><span>이야기</span><textarea id="fText" placeholder="오늘 있었던 일을 적어보세요"></textarea></label>
    <label class="field"><span>사진 (여러 장 가능)</span><input id="fPhotos" type="file" accept="image/*" multiple></label>
    <div class="modalBtns">
      <button type="button" class="btn" id="entryCancel">취소</button>
      <button type="submit" class="btn primary" id="entrySubmit">저장</button>
    </div>
    <p id="entryMsg"></p>
  </form>
</div>

<div class="photo-view" id="photoView"><img id="photoViewImg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyANQqsO1CX8X-HjDDfObnY7ErHzQp4Gk4k",
  authDomain: "travelerplan-8696b.firebaseapp.com",
  databaseURL: "https://travelerplan-8696b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "travelerplan-8696b",
  storageBucket: "travelerplan-8696b.firebasestorage.app",
  messagingSenderId: "947956439036",
  appId: "1:947956439036:web:23644e74b41a8a537b0479"
});
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

// ---------- 국가 목록 (alpha-2 코드 / ISO 숫자코드 / 한글 이름) ----------
// ISO 숫자코드는 지구본에 쓰는 countries-110m.json 폴리곤의 id와 매칭하는 데 쓴다.

const COUNTRIES = [
['KR','410','대한민국'],['JP','392','일본'],['CN','156','중국'],['TW','158','대만'],['HK','344','홍콩'],
['VN','704','베트남'],['TH','764','태국'],['SG','702','싱가포르'],['MY','458','말레이시아'],['ID','360','인도네시아'],
['PH','608','필리핀'],['KH','116','캄보디아'],['LA','418','라오스'],['MM','104','미얀마'],['IN','356','인도'],
['NP','524','네팔'],['LK','144','스리랑카'],['MV','462','몰디브'],['MN','496','몽골'],['KZ','398','카자흐스탄'],
['UZ','860','우즈베키스탄'],['AE','784','아랍에미리트'],['QA','634','카타르'],['SA','682','사우디아라비아'],
['IL','376','이스라엘'],['JO','400','요르단'],['TR','792','튀르키예'],['GE','268','조지아'],['AM','051','아르메니아'],
['AZ','031','아제르바이잔'],['RU','643','러시아'],['UA','804','우크라이나'],['PL','616','폴란드'],['CZ','203','체코'],
['SK','703','슬로바키아'],['HU','348','헝가리'],['AT','040','오스트리아'],['CH','756','스위스'],['DE','276','독일'],
['NL','528','네덜란드'],['BE','056','벨기에'],['LU','442','룩셈부르크'],['FR','250','프랑스'],['MC','492','모나코'],
['ES','724','스페인'],['PT','620','포르투갈'],['IT','380','이탈리아'],['VA','336','바티칸'],['SM','674','산마리노'],
['GR','300','그리스'],['MT','470','몰타'],['CY','196','키프로스'],['GB','826','영국'],['IE','372','아일랜드'],
['IS','352','아이슬란드'],['DK','208','덴마크'],['NO','578','노르웨이'],['SE','752','스웨덴'],['FI','246','핀란드'],
['EE','233','에스토니아'],['LV','428','라트비아'],['LT','440','리투아니아'],['BY','112','벨라루스'],['MD','498','몰도바'],
['RO','642','루마니아'],['BG','100','불가리아'],['RS','688','세르비아'],['HR','191','크로아티아'],['SI','705','슬로베니아'],
['BA','070','보스니아헤르체고비나'],['ME','499','몬테네그로'],['MK','807','북마케도니아'],['AL','008','알바니아'],
['LI','438','리히텐슈타인'],['AD','020','안도라'],['EG','818','이집트'],['MA','504','모로코'],['TN','788','튀니지'],
['DZ','012','알제리'],['LY','434','리비아'],['ZA','710','남아프리카공화국'],['KE','404','케냐'],['TZ','834','탄자니아'],
['ET','231','에티오피아'],['GH','288','가나'],['NG','566','나이지리아'],['SN','686','세네갈'],['MU','480','모리셔스'],
['SC','690','세이셸'],['MG','450','마다가스카르'],['NA','516','나미비아'],['BW','072','보츠와나'],['ZW','716','짐바브웨'],
['US','840','미국'],['CA','124','캐나다'],['MX','484','멕시코'],['CU','192','쿠바'],['DO','214','도미니카공화국'],
['JM','388','자메이카'],['GT','320','과테말라'],['CR','188','코스타리카'],['PA','591','파나마'],['CO','170','콜롬비아'],
['VE','862','베네수엘라'],['EC','218','에콰도르'],['PE','604','페루'],['BO','068','볼리비아'],['BR','076','브라질'],
['PY','600','파라과이'],['UY','858','우루과이'],['AR','032','아르헨티나'],['CL','152','칠레'],
['AU','036','호주'],['NZ','554','뉴질랜드'],['FJ','242','피지'],['PG','598','파푸아뉴기니'],['WS','882','사모아'],
['TO','776','통가'],['GU','316','괌'],['PW','585','팔라우'],
].sort((a,b)=>a[2].localeCompare(b[2],'ko'));
const COUNTRY_BY_CODE = Object.fromEntries(COUNTRIES.map((c)=>[c[0], c]));

const $ = (s) => document.querySelector(s);

// ---------- 인증 ----------
let authMode = 'login';
function setAuthMode(mode) {
  authMode = mode;
  $('#tabLogin').setAttribute('aria-selected', String(mode === 'login'));
  $('#tabSignup').setAttribute('aria-selected', String(mode === 'signup'));
  $('#authSubmit').textContent = mode === 'login' ? '로그인' : '회원가입';
  $('#authPw').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('#authMsg').textContent = '';
}
$('#tabLogin').addEventListener('click', () => setAuthMode('login'));
$('#tabSignup').addEventListener('click', () => setAuthMode('signup'));

$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#authEmail').value.trim();
  const pw = $('#authPw').value;
  $('#authMsg').textContent = '';
  $('#authSubmit').disabled = true;
  try {
    if (authMode === 'login') await auth.signInWithEmailAndPassword(email, pw);
    else await auth.createUserWithEmailAndPassword(email, pw);
  } catch (err) {
    $('#authMsg').textContent = authErrMsg(err);
  } finally {
    $('#authSubmit').disabled = false;
  }
});
function authErrMsg(err) {
  const map = {
    'auth/email-already-in-use': '이미 가입된 이메일이에요. 로그인해 주세요.',
    'auth/invalid-email': '이메일 형식이 올바르지 않아요.',
    'auth/weak-password': '비밀번호는 6자 이상이어야 해요.',
    'auth/user-not-found': '가입되지 않은 이메일이에요.',
    'auth/wrong-password': '비밀번호가 올바르지 않아요.',
    'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않아요.',
  };
  return map[err.code] || `오류가 발생했어요 (${err.code || err.message}).`;
}
$('#logoutBtn').addEventListener('click', () => auth.signOut());

// ---------- 데이터 ----------
let uid = null;
let entries = {}; // id -> entry
let activeCountry = null;
let entriesRef = null;

auth.onAuthStateChanged((user) => {
  if (user) {
    uid = user.uid;
    $('#authScreen').style.display = 'none';
    $('#appScreen').classList.add('on');
    $('#whoEmail').textContent = user.email;
    if (entriesRef) entriesRef.off();
    entriesRef = db.ref(`users/${uid}/entries`);
    entriesRef.on('value', (snap) => {
      entries = snap.val() || {};
      renderCountryList();
      renderEntryList();
      renderGlobeColors();
    });
  } else {
    uid = null; entries = {}; activeCountry = null;
    if (entriesRef) { entriesRef.off(); entriesRef = null; }
    $('#appScreen').classList.remove('on');
    $('#authScreen').style.display = 'flex';
  }
});

function visitedCodes() {
  const set = new Set();
  Object.values(entries).forEach((e) => { if (e && e.countryCode) set.add(e.countryCode); });
  return set;
}

function renderCountryList() {
  const box = $('#countryList'); box.textContent = '';
  const codes = [...visitedCodes()].sort((a, b) => (COUNTRY_BY_CODE[a]?.[2] || a).localeCompare(COUNTRY_BY_CODE[b]?.[2] || b, 'ko'));
  if (!codes.length) { box.innerHTML = '<li style="color:var(--ink-2);font-size:12.5px;">아직 기록이 없어요</li>'; return; }
  codes.forEach((code) => {
    const li = document.createElement('li');
    const b = document.createElement('button'); b.type = 'button';
    b.textContent = COUNTRY_BY_CODE[code] ? COUNTRY_BY_CODE[code][2] : code;
    if (code === activeCountry) b.classList.add('active');
    b.addEventListener('click', () => selectCountry(code));
    li.appendChild(b); box.appendChild(li);
  });
}

function selectCountry(code) {
  activeCountry = code;
  renderCountryList();
  renderEntryList();
}

function renderEntryList() {
  const title = $('#entryListTitle');
  const list = $('#entryList'); list.textContent = '';
  const empty = $('#emptyNote');
  if (!activeCountry) {
    title.textContent = '나라를 골라보세요';
    empty.hidden = Object.keys(entries).length > 0;
    return;
  }
  title.textContent = `📍 ${COUNTRY_BY_CODE[activeCountry] ? COUNTRY_BY_CODE[activeCountry][2] : activeCountry}`;
  empty.hidden = true;
  const rows = Object.entries(entries)
    .filter(([, e]) => e && e.countryCode === activeCountry)
    .sort((a, b) => (b[1].date || '').localeCompare(a[1].date || ''));
  if (!rows.length) { list.innerHTML = '<li style="color:var(--ink-2);font-size:12.5px;">이 나라에는 아직 기록이 없어요</li>'; return; }
  rows.forEach(([id, e]) => {
    const li = document.createElement('li'); li.className = 'entry';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = `${e.date || ''}${e.city ? ' · ' + e.city : ''}`;
    li.appendChild(meta);
    if (e.text) { const p = document.createElement('p'); p.className = 'text'; p.textContent = e.text; li.appendChild(p); }
    if (e.photos && e.photos.length) {
      const row = document.createElement('div'); row.className = 'photos';
      e.photos.forEach((url) => {
        const img = document.createElement('img'); img.src = url; img.alt = '여행 사진';
        img.addEventListener('click', () => { $('#photoViewImg').src = url; $('#photoView').classList.add('on'); });
        row.appendChild(img);
      });
      li.appendChild(row);
    }
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '🗑 삭제';
    del.addEventListener('click', () => deleteEntry(id));
    li.appendChild(del);
    list.appendChild(li);
  });
}
$('#photoView').addEventListener('click', () => $('#photoView').classList.remove('on'));

async function deleteEntry(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  await db.ref(`users/${uid}/entries/${id}`).remove();
}

// ---------- 일기 추가 모달 ----------
function fillCountrySelect() {
  const sel = $('#fCountry'); sel.textContent = '';
  COUNTRIES.forEach(([code, , ko]) => {
    const opt = document.createElement('option'); opt.value = code; opt.textContent = ko; sel.appendChild(opt);
  });
}
fillCountrySelect();

$('#fab').addEventListener('click', () => {
  $('#entryMsg').textContent = '';
  $('#entryForm').reset();
  if (activeCountry) $('#fCountry').value = activeCountry;
  $('#fDate').value = new Date().toISOString().slice(0, 10);
  $('#entryModal').classList.add('on');
});
$('#entryCancel').addEventListener('click', () => $('#entryModal').classList.remove('on'));

$('#entryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = $('#fCountry').value;
  const city = $('#fCity').value.trim();
  const date = $('#fDate').value;
  const text = $('#fText').value.trim();
  const files = [...$('#fPhotos').files];
  $('#entryMsg').style.color = 'var(--ink-2)';
  $('#entryMsg').textContent = '';
  $('#entrySubmit').disabled = true;
  try {
    const id = db.ref(`users/${uid}/entries`).push().key;
    let photos = [];
    if (files.length) {
      $('#entryMsg').textContent = `사진 올리는 중… (0/${files.length})`;
      for (let i = 0; i < files.length; i++) {
        const path = `users/${uid}/entries/${id}/${Date.now()}_${i}_${files[i].name}`;
        const task = storage.ref(path);
        await task.put(files[i]);
        const url = await task.getDownloadURL();
        photos.push(url);
        $('#entryMsg').textContent = `사진 올리는 중… (${i + 1}/${files.length})`;
      }
    }
    await db.ref(`users/${uid}/entries/${id}`).set({
      countryCode: code,
      countryKo: COUNTRY_BY_CODE[code] ? COUNTRY_BY_CODE[code][2] : code,
      city, date, text, photos,
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    });
    $('#entryModal').classList.remove('on');
    activeCountry = code; renderCountryList(); renderEntryList();
  } catch (err) {
    $('#entryMsg').style.color = 'var(--err)';
    $('#entryMsg').textContent = `저장 실패: ${err.message || err}`;
  } finally {
    $('#entrySubmit').disabled = false;
  }
});

// ---------- 지구본 ----------
let map = null;
let geoReady = false;

function initGlobe() {
  map = new maplibregl.Map({
    container: 'globeMap',
    style: {
      version: 8,
      sources: {},
      layers: [{ id: 'bg', type: 'background', paint: { 'background-color': getComputedStyle(document.documentElement).getPropertyValue('--sea').trim() } }],
    },
    center: [127, 20],
    zoom: 1.1,
    projection: 'globe',
    attributionControl: false,
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
  map.on('load', async () => {
    try {
      const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')).json();
      const geo = topojson.feature(topo, topo.objects.countries);
      map.addSource('countries', { type: 'geojson', data: geo });
      map.addLayer({
        id: 'countries-fill', type: 'fill', source: 'countries',
        paint: { 'fill-color': getComputedStyle(document.documentElement).getPropertyValue('--land').trim(), 'fill-opacity': 1 },
      });
      map.addLayer({
        id: 'countries-line', type: 'line', source: 'countries',
        paint: { 'line-color': getComputedStyle(document.documentElement).getPropertyValue('--ink-2').trim(), 'line-width': 0.5 },
      });
      geoReady = true;
      renderGlobeColors();
      map.on('click', 'countries-fill', (e) => {
        const id = e.features[0].id;
        const code = ISO_TO_ALPHA2[String(id)];
        if (code && COUNTRY_BY_CODE[code]) selectCountry(code);
      });
      map.on('mouseenter', 'countries-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'countries-fill', () => { map.getCanvas().style.cursor = ''; });
    } catch (err) { console.warn('지구본 폴리곤 로딩 실패', err); }
  });
}
const ISO_TO_ALPHA2 = Object.fromEntries(COUNTRIES.map((c) => [c[1].replace(/^0+/, '') || '0', c[0]]));

function renderGlobeColors() {
  if (!map || !geoReady) return;
  const codes = [...visitedCodes()];
  const isoNums = codes.map((c) => Number(COUNTRY_BY_CODE[c] ? COUNTRY_BY_CODE[c][1] : -1)).filter((n) => n >= 0);
  const landColor = getComputedStyle(document.documentElement).getPropertyValue('--land').trim();
  const visitedColor = getComputedStyle(document.documentElement).getPropertyValue('--visited').trim();
  if (!isoNums.length) {
    map.setPaintProperty('countries-fill', 'fill-color', landColor);
    return;
  }
  map.setPaintProperty('countries-fill', 'fill-color', [
    'case', ['in', ['to-number', ['id']], ['literal', isoNums]], visitedColor, landColor,
  ]);
}

initGlobe();
</script>
